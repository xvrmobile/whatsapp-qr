<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Manager</title>
    <!-- Elegant Font Imports -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Serif+SC:wght@700&family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

    <style>
        :root { 
            --primary: #059669; 
            --error: #dc2626; 
        }
        
        * {
            box-sizing: border-box; /* Fixes elements overflowing layout container widths */
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: flex-end; /* Moves box to bottom */
            min-height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('188.png');
            background-size: cover;
            background-position: center;
        }

        .card { 
            background: rgba(255, 255, 255, 0.05); /* Transparent Glass */
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            padding: 40px; 
            border-radius: 32px; 
            width: 90%; 
            max-width: 400px; 
            text-align: center;
            margin-bottom: 50px; 
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        h2 { 
            font-family: 'Playfair Display', 'Noto Serif SC', serif; 
            font-size: 32px; 
            color: #ffffff; 
            margin-top: 0;
            margin-bottom: 10px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        /* White and Bold Scanner Text */
        #scanStatus { 
            color: #ffffff !important; 
            font-weight: 700; 
            font-size: 20px; 
            text-shadow: 0 2px 6px rgba(0,0,0,0.4);
            word-break: break-word;
        }

        input { 
            width: 100%; 
            padding: 14px; 
            margin: 8px 0; 
            border-radius: 12px; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            font-size: 16px;
            background: rgba(255, 255, 255, 0.9);
        }
        
        input:focus {
            outline: 2px solid var(--primary);
        }

        .btn { 
            width: 100%; 
            padding: 16px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-weight: 700; 
            cursor: pointer; 
            margin-top: 8px;
            font-size: 16px;
            transition: background 0.2s ease;
        }

        .btn:hover {
            background: #047857;
        }

        #qrcode { 
            margin-top: 25px; 
            background: white; 
            padding: 15px; 
            border-radius: 16px; 
            display: inline-block; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }

        .hidden { display: none; }

        @keyframes pop {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div id="ownerSection" class="card">
    <h2>QR Setup</h2>
    <input type="text" id="phone" placeholder="Phone Number">
    <input type="text" id="msg" placeholder="Message (Chinese supported)">
    <button class="btn" onclick="generateAndSave()">Generate QR</button>
    <div id="qrcode" class="hidden"></div>
</div>

<div id="scannerSection" class="card hidden">
    <div id="iconBox" style="margin-bottom: 20px;"></div>
    <h2 id="scanTitle">Checking...</h2>
    <p id="scanStatus"></p>
</div>

<script>
    // Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyBjZ8NV2a6ioBymuuP_rLvcRyU235vBED0",
        authDomain: "whataspp-qr-manager.firebaseapp.com",
        projectId: "whataspp-qr-manager",
        storageBucket: "whataspp-qr-manager.firebasestorage.app",
        messagingSenderId: "167596898871",
        appId: "1:167596898871:web:4088c105ebf5217b53ddb2"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const params = new URLSearchParams(window.location.search);
    const qrId = params.get('id');

    // Handle Scan Mode
    if (qrId) {
        document.getElementById('ownerSection').classList.add('hidden');
        document.getElementById('scannerSection').classList.remove('hidden');
        const docRef = db.collection("qrcodes").doc(qrId);

        docRef.get().then((doc) => {
            if (doc.exists && !doc.data().isUsed) {
                const data = doc.data();
                docRef.update({ isUsed: true });

                // Telegram Alert Setup
                const token = "8713373047:AAEQmNUr5Eewo0TEt_RDcYy9kxii27-bdvY";
                const chatId = "623086762";
                const alertText = `💐 New Scan: ${data.msg || 'No message'} (Phone: ${data.phone})`;
                
                fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(alertText)}`);

                document.getElementById('iconBox').innerHTML = `<div style="font-size: 80px; animation: pop 0.6s ease-out;">💐</div>`;
                document.getElementById('scanTitle').innerText = "幸福长久，相敬如宾, 惜缘！";
                document.getElementById('scanStatus').innerText = data.msg || "谢谢！";
            } else {
                document.getElementById('iconBox').innerHTML = `<div style="font-size: 80px;">❌</div>`;
                document.getElementById('scanTitle').innerText = "扫码失败";
                document.getElementById('scanStatus').style.color = "var(--error)";
                document.getElementById('scanStatus').innerText = "此码已被扫过了。";
            }
        }).catch((error) => {
            console.error("Error reading database: ", error);
            document.getElementById('scanTitle').innerText = "错误";
            document.getElementById('scanStatus').innerText = "无法读取数据库信息。";
        });
    }

    // Handle Generation Mode
    function generateAndSave() {
        const phone = document.getElementById('phone').value.trim();
        const msg = document.getElementById('msg').value.trim();
        
        if (!phone) {
            alert("Please enter a phone number.");
            return;
        }
        
        db.collection("qrcodes").add({ 
            phone: phone, 
            msg: msg, 
            isUsed: false,
            createdAt: firebase.firestore.FieldValue.serverTimestamp() // Good practice for sorting later
        }).then((docRef) => {
            const baseUrl = window.location.href.split('?')[0];
            const qrTargetUrl = `${baseUrl}?id=${docRef.id}`;
            
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = "";
            qrContainer.classList.remove('hidden');
            
            // Generate the code element safely
            new QRCode(qrContainer, { 
                text: qrTargetUrl, 
                width: 180, 
                height: 180,
                correctLevel: QRCode.CorrectLevel.H // Higher error correction handles minor print blemishes
            });
        }).catch((err) => {
            alert("Error saving code to Firebase. Check console.");
            console.error(err);
        });
    }
</script>
</body>
</html>

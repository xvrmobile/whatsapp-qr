<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart QR Link</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        .hidden { display: none; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; background: #25D366; color: white; }
        #qrcode { margin-top: 20px; display: inline-block; padding: 10px; border: 1px solid #eee; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #25D366; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<!-- OWNER INTERFACE -->
<div id="setupMode" class="card">
    <h2 style="color: #075e54;">QR Setup</h2>
    <p>Enter details to create a QR that shows a message to the scanner.</p>
    <input type="text" id="phone" placeholder="Your Phone (6591234567)">
    <input type="text" id="msg" placeholder="WhatsApp Message Content">
    <button class="btn" onclick="generate()">Generate Smart QR</button>
    <div id="qrcode"></div>
    <div id="debugInfo" style="font-size: 10px; color: #999; margin-top: 10px; word-break: break-all;"></div>
</div>

<!-- SCANNER INTERFACE -->
<div id="scanMode" class="card hidden">
    <h2 style="color: #075e54;">Congratulation on your big day!</h2>
    <h2 style="color: #075e54;">I am so happy for you !</h2>
    <p>Here's is something to kick start this new phase of your life. Send out the message to find out. Opening WhatsApp in 6 seconds...</p>
    <div class="loader"></div>
    <button class="btn" id="waButton">Open WhatsApp Now</button>
</div>

<script>
    // 1. DETECTION LOGIC
    const params = new URLSearchParams(window.location.search);
    const p = params.get('p');
    const m = params.get('m');

    if (p && m) {
        // ACTIVATE SCANNER MODE
        document.getElementById('setupMode').classList.add('hidden');
        document.getElementById('scanMode').classList.remove('hidden');
        
        const finalLink = `https://wa.me/${p}?text=${encodeURIComponent(m)}`;
        
        document.getElementById('waButton').onclick = () => { window.location.href = finalLink; };
        setTimeout(() => { window.location.href = finalLink; }, 6000);
    }

    // 2. GENERATION LOGIC
    function generate() {
        const phone = document.getElementById('phone').value.replace(/\D/g, '');
        const message = document.getElementById('msg').value;
        
        if(!phone) { alert("Please enter a phone number"); return; }

        // Automatically find the URL of your GitHub page
        const currentUrl = window.location.href.split('?')[0];
        
        // This is the CRITICAL part: The QR must point to YOUR site
        const smartLink = `${currentUrl}?p=${phone}&m=${encodeURIComponent(message)}`;

        // Show the link for debugging
        document.getElementById('debugInfo').innerText = "QR points to: " + smartLink;

        const qrDiv = document.getElementById("qrcode");
        qrDiv.innerHTML = "";
        new QRCode(qrDiv, {
            text: smartLink,
            width: 200,
            height: 200,
            correctLevel : QRCode.CorrectLevel.H
        });
    }
</script>
</body>
</html>

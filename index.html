<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One-Scan WhatsApp QR</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #e5ddd5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 380px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; background-color: #25D366; color: white; }
        #qrcode { margin-top: 20px; display: inline-block; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="ownerSection" class="card">
    <h2>QR Setup</h2>
    <input type="text" id="phone" placeholder="Phone (e.g. 65...)">
    <input type="text" id="msg" placeholder="Message">
    <button class="btn" onclick="generateAndSave()">Generate QR</button>
    <div id="qrcode"></div>
</div>

<div id="scannerSection" class="card hidden">
    <h2 id="scanTitle">Success!</h2>
    <p id="scanStatus">Opening WhatsApp in 6 seconds...</p>
    <button class="btn" id="waBtn">Open Now</button>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBjZ8NV2a6ioBymuuP_rLvcRyU235vBED0",
        authDomain: "whataspp-qr-manager.firebaseapp.com",
        projectId: "whataspp-qr-manager",
        storageBucket: "whataspp-qr-manager.firebasestorage.app",
        messagingSenderId: "167596898871",
        appId: "1:167596898871:web:4088c105ebf5217b53ddb2"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const params = new URLSearchParams(window.location.search);
    const qrId = params.get('id');

 if (qrId) {
        document.getElementById('ownerSection').classList.add('hidden');
        document.getElementById('scannerSection').classList.remove('hidden');
        const docRef = db.collection("qrcodes").doc(qrId);

        docRef.get().then((doc) => {
            if (doc.exists && !doc.data().isUsed) {
                const data = doc.data();
                
                // 1. Mark as used
                docRef.update({ isUsed: true });

                // 2. SEND NOTIFICATION TO YOU VIA TELEGRAM
                const botToken = "YOUR_BOT_TOKEN_HERE";
                const chatId = "YOUR_USER_ID_HERE";
                const text = `🚨 QR Scanned! \nMessage: ${data.msg}\nPhone: ${data.phone}`;
                
                fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(text)}`);

                // 3. Update the scanner's screen
                document.getElementById('scanTitle').innerText = "Verified";
                document.getElementById('scanStatus').innerText = "Thank you! Your scan has been recorded. You may close this page.";
                document.getElementById('waBtn').classList.add('hidden');
            } else {
                document.getElementById('scanTitle').innerText = "Expired";
                document.getElementById('scanStatus').innerText = "This code has already been used.";
            }
        });
    }

    function generateAndSave() {
        const phone = document.getElementById('phone').value.replace(/\D/g, '');
        const msg = document.getElementById('msg').value;
        if (!phone) return;

        db.collection("qrcodes").add({ phone, msg, isUsed: false })
        .then((docRef) => {
            const baseUrl = window.location.href.split('?')[0];
            const finalLink = `${baseUrl}?id=${docRef.id}`;
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById('qrcode'), finalLink);
        });
    }
</script>
</body>
</html>

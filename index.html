<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp QR Link</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background-color: #f0f2f5; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #075e54; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; background: #25D366; color: white; font-size: 16px; }
        #qrcode { margin-top: 20px; display: flex; justify-content: center; }
        .hidden { display: none; }
    </style>
</head>
<body>

<!-- VIEW 1: FOR THE OWNER (To generate the code) -->
<div id="ownerView" class="card">
    <h2>QR Setup</h2>
    <input type="text" id="phone" placeholder="Your Phone (e.g. 6591234567)">
    <input type="text" id="waMsg" placeholder="Message you want to receive">
    <button class="btn" onclick="generateQR()">Generate QR Code</button>
    <div id="qrcode"></div>
    <p style="font-size: 12px; color: #666; margin-top: 10px;">Scanner will see a "Thank You" message before WhatsApp opens.</p>
</div>

<!-- VIEW 2: FOR THE SCANNER (What they see after scanning) -->
<div id="scannerView" class="card hidden">
    <h2>Thank You!</h2>
    <p id="displayMsg">We are connecting you to WhatsApp now...</p>
    <button class="btn" id="redirectBtn">Click here to start Chat</button>
</div>

<script>
    // CHECK: Is someone scanning this right now?
    const urlParams = new URLSearchParams(window.location.search);
    const targetPhone = urlParams.get('p');
    const targetMsg = urlParams.get('m');

    if (targetPhone) {
        // Show Scanner View
        document.getElementById('ownerView').classList.add('hidden');
        document.getElementById('scannerView').classList.remove('hidden');
        
        const finalUrl = `https://wa.me/${targetPhone}?text=${encodeURIComponent(targetMsg)}`;
        
        // Auto-redirect after 3 seconds
        setTimeout(() => {
            window.location.href = finalUrl;
        }, 3000);

        document.getElementById('redirectBtn').onclick = () => { window.location.href = finalUrl; };
    }

    function generateQR() {
        const phone = document.getElementById('phone').value.replace(/\D/g, '');
        const msg = document.getElementById('waMsg').value;
        
        if (!phone) { alert("Enter phone number"); return; }

        // Create a link to THIS current website with the data attached
        const currentUrl = window.location.href.split('?')[0];
        const scannerLink = `${currentUrl}?p=${phone}&m=${encodeURIComponent(msg)}`;

        const qrContainer = document.getElementById("qrcode");
        qrContainer.innerHTML = "";
        new QRCode(qrContainer, {
            text: scannerLink,
            width: 200,
            height: 200
        });
        
        console.log("Scanner will be sent to: " + scannerLink);
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Manager</title>
    <!-- Elegant Font Imports -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Noto+Serif+SC:wght@400;700&family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

    <style>
        :root { 
            --primary: #059669; 
            --error: #dc2626; 
        }
        
        * {
            box-sizing: border-box;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: flex-end; 
            min-height: 100vh;
            min-height: 100dvh;
            width: 100vw;
            overflow: hidden;
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            transition: background 0.3s ease;
        }

        /* --- BASE GLASS CARD DESIGN --- */
        .card { 
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            padding: 24px 20px; 
            border-radius: 24px; 
            width: 85%; 
            max-width: 320px; 
            text-align: center;
            margin-bottom: 35px; 
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
        }

        h2 { 
            font-family: 'Playfair Display', 'Noto Serif SC', serif; 
            font-size: 24px; 
            margin-top: 0;
            margin-bottom: 10px;
            transition: color 0.3s ease;
        }

        #scanStatus { 
            font-size: 16px; 
            line-height: 1.5;
            word-break: break-word;
            margin-top: 6px;
            white-space: pre-wrap; /* Preserves line breaks */
            transition: color 0.3s ease;
        }

        /* ========================================================= */
        /* INDIVIDUAL THEME CONFIGURATIONS                           */
        /* ========================================================= */

        /* --- THEME 1: WEDDING --- */
        body.theme-wedding {
            /* Restored original background image without dark gradient overlay */
            background-image: url('188.png');
        }

        /* Removes the rounded glass card box specifically for Wedding theme */
        body.theme-wedding .card {
            background: transparent;
            border: none;
            box-shadow: none;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
        }

        body.theme-wedding h2 {
            color: #000000;       /* Title Color: Black */
            font-weight: 700;     /* Title Boldness: 700 (Bold) */
            text-shadow: none;
        }

        body.theme-wedding #scanStatus {
            color: #000000;       /* Message Color: Black */
            font-weight: 400;     /* Message Boldness: 400 (Unbolded) */
            text-shadow: none;
        }

        /* --- THEME 2: BIRTHDAY --- */
        body.theme-birthday {
            background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('birthday_bg.png');
        }
        body.theme-birthday h2 {
            color: #ffffff;       /* Title Color: White */
            font-weight: 700;     /* Title Boldness: 700 (Bold) */
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        body.theme-birthday #scanStatus {
            color: #ffffff;       /* Message Color: White */
            font-weight: 700;     /* Message Boldness: 700 (Bold) */
            text-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }

        /* --- THEME 3: NEW HOME --- */
        body.theme-newhome {
            background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('newhome_bg.png');
        }
        body.theme-newhome h2 {
            color: #ffffff;       /* Title Color: White */
            font-weight: 700;     /* Title Boldness: 700 (Bold) */
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        body.theme-newhome #scanStatus {
            color: #ffffff;       /* Message Color: White */
            font-weight: 700;     /* Message Boldness: 700 (Bold) */
            text-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }

        /* ========================================================= */

        /* --- FORM ELEMENTS --- */
        input, select, textarea { 
            width: 100%; 
            padding: 14px; 
            margin: 6px 0; 
            border-radius: 12px; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            font-size: 15px;
            background: rgba(255, 255, 255, 0.9);
            font-family: inherit;
            resize: vertical;
            color: #000000;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: 2px solid var(--primary);
        }

        .heart-divider {
            font-size: 22px;
            margin: 8px 0 2px 0;
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.6));
            animation: pulse 2s infinite ease-in-out;
        }

        .btn { 
            width: 100%; 
            padding: 14px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-weight: 700; 
            cursor: pointer; 
            margin-top: 8px;
            font-size: 16px;
            transition: background 0.2s ease;
        }

        .btn:hover {
            background: #047857;
        }

        #qrcode { 
            margin-top: 20px; 
            background: white; 
            padding: 12px; 
            border-radius: 16px; 
            display: inline-block; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }

        .hidden { display: none; }

        @keyframes pop {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
    </style>
</head>
<body>

<div id="ownerSection" class="card">
    <h2 style="color: #ffffff; text-shadow: 0 2px 6px rgba(0,0,0,0.4);">QR Setup</h2>
    <input type="text" id="phone" placeholder="Phone Number">
    
    <!-- Textarea field supporting line breaks -->
    <textarea id="msg" placeholder="Message (Press Enter or use \n for line breaks)" rows="3"></textarea>
    
    <select id="themeSelect">
        <option value="wedding">💐 Floral / Wedding</option>
        <option value="birthday">🎂 Birthday Party</option>
        <option value="newhome">🏠 New Home Celebration</option>
    </select>

    <button class="btn" onclick="generateAndSave()">Generate QR</button>
    <div id="qrcode" class="hidden"></div>
</div>

<div id="scannerSection" class="card hidden">
    <div id="iconBox" style="margin-bottom: 10px;"></div>
    <h2 id="scanTitle">Checking...</h2>
    <div id="heartBox" class="heart-divider hidden">❤️</div>
    <p id="scanStatus"></p>
</div>

<script>
    // Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyBjZ8NV2a6ioBymuuP_rLvcRyU235vBED0",
        authDomain: "whataspp-qr-manager.firebaseapp.com",
        projectId: "whataspp-qr-manager",
        storageBucket: "whataspp-qr-manager.firebasestorage.app",
        messagingSenderId: "167596898871",
        appId: "1:167596898871:web:4088c105ebf5217b53ddb2"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Read URL Parameters
    const params = new URLSearchParams(window.location.search);
    const qrId = params.get('id');
    const urlTheme = params.get('theme') || 'wedding';

    // Theme Customization Map
    const themeConfig = {
        wedding: {
            bodyClass: 'theme-wedding',
            icon: '💐',
            title: '幸福长久，相敬如宾, \n 惜缘！',
            telegramPrefix: '💐 Wedding Scan'
        },
        birthday: {
            bodyClass: 'theme-birthday',
            icon: '🎂',
            title: '生日快乐，心想事成！',
            telegramPrefix: '🎂 Birthday Scan'
        },
        newhome: {
            bodyClass: 'theme-newhome',
            icon: '🏠',
            title: '乔迁之喜，阖家欢乐，\n 顺心如意！',
            telegramPrefix: '🏠 New Home Scan'
        }
    };

    // Apply active theme class to <body>
    const activeTheme = themeConfig[urlTheme] || themeConfig.wedding;
    document.body.className = activeTheme.bodyClass;

    // Handle Scan Mode
    if (qrId) {
        document.getElementById('ownerSection').classList.add('hidden');
        document.getElementById('scannerSection').classList.remove('hidden');
        const docRef = db.collection("qrcodes").doc(qrId);

        docRef.get().then((doc) => {
            if (doc.exists && !doc.data().isUsed) {
                const data = doc.data();
                docRef.update({ isUsed: true });

                // Telegram Alert Setup
                const token = "8713373047:AAEQmNUr5Eewo0TEt_RDcYy9kxii27-bdvY";
                const chatId = "623086762";
                const alertText = `${activeTheme.telegramPrefix}:\n${data.msg || 'No message'}\n(Phone: ${data.phone})`;
                
                fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(alertText)}`);

                // Update mobile UI
                document.getElementById('iconBox').innerHTML = `<div style="font-size: 70px; animation: pop 0.6s ease-out;">${activeTheme.icon}</div>`;
                
                // Formats \n in theme title to <br> for multi-line titles
                document.getElementById('scanTitle').innerHTML = activeTheme.title.replace(/\\n/g, '<br>').replace(/\n/g, '<br>');
                document.getElementById('heartBox').classList.remove('hidden');
                
                // Format typed \n or Enter line breaks into HTML <br>
                const formattedMsg = (data.msg || "谢谢！").replace(/\\n/g, '<br>').replace(/\n/g, '<br>');
                document.getElementById('scanStatus').innerHTML = formattedMsg;
            } else {
                document.getElementById('iconBox').innerHTML = `<div style="font-size: 70px;">❌</div>`;
                document.getElementById('scanTitle').innerText = "扫码失败";
                document.getElementById('heartBox').classList.add('hidden');
                document.getElementById('scanStatus').style.color = "var(--error)";
                document.getElementById('scanStatus').innerText = "此码已被扫过了。";
            }
        }).catch((error) => {
            console.error("Error reading database: ", error);
            document.getElementById('scanTitle').innerText = "错误";
            document.getElementById('heartBox').classList.add('hidden');
            document.getElementById('scanStatus').innerText = "无法读取数据库信息。";
        });
    }

    // Handle Generation Mode
    function generateAndSave() {
        const phone = document.getElementById('phone').value.trim();
        const msg = document.getElementById('msg').value.trim();
        const selectedTheme = document.getElementById('themeSelect').value;
        
        if (!phone) {
            alert("Please enter a phone number.");
            return;
        }
        
        db.collection("qrcodes").add({ 
            phone: phone, 
            msg: msg, 
            theme: selectedTheme,
            isUsed: false,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        }).then((docRef) => {
            const baseUrl = window.location.href.split('?')[0];
            const qrTargetUrl = `${baseUrl}?id=${docRef.id}&theme=${selectedTheme}`;
            
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = "";
            qrContainer.classList.remove('hidden');
            
            new QRCode(qrContainer, { 
                text: qrTargetUrl, 
                width: 160, 
                height: 160,
                correctLevel: QRCode.CorrectLevel.H
            });
        }).catch((err) => {
            alert("Error saving code to Firebase. Check console.");
            console.error(err);
        });
    }
</script>
</body>
</html>

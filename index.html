<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp QR Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        input, button { margin: 10px; padding: 10px; width: 250px; border-radius: 5px; border: 1px solid #ccc; }
        button { background-color: #25D366; color: white; border: none; cursor: pointer; font-weight: bold; }
        #qrcode { margin-top: 20px; }
    </style>
    <button onclick="downloadQR()" id="downloadBtn" style="display:none; background-color: #34B7F1;">Download QR</button>
</head>
<body>
    <h2>WhatsApp QR Generator</h2>
    <input type="text" id="phone" placeholder="Phone (e.g. 1234567890)">
    <input type="text" id="message" placeholder="Type your message here...">
    <button onclick="generateQR()">Generate QR Code</button>
    
    <div id="qrcode"></div>

    <script>
        function generateQR() {
            const phone = document.getElementById('phone').value.replace(/\D/g,'');
            const message = encodeURIComponent(document.getElementById('message').value);
            const whatsappUrl = `https://wa.me/${phone}?text=${message}`;
            
            const qrContainer = document.getElementById("qrcode");
            qrContainer.innerHTML = ""; // Clear previous QR
            
            if(!phone) { alert("Please enter a phone number"); return; }

            new QRCode(qrContainer, {
                text: whatsappUrl,
                width: 256,
                height: 256,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        }
    </script>
</body>
</html>
